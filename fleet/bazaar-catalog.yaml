        source_repository: https://github.com/hrbrlife/Claude-Melusina
        # This app embeds Claude Code, its loader and its full shared-library
        # closure INSIDE the signed SPK, so an installed grain never uploads a
        # binary and never borrows one from the build host. That archive is
        # ~100 MB of third-party bytes and is deliberately untracked in Git,
        # so the build cannot run without it being handed in. This reviewed
        # profile is the only sanctioned way to do that: the provider accepts
