# Its absence from the observed live projection is not a retirement decision.
expected_live_app_count: 35
default_release_state: hold
default_reconciliation_state: source-pinned
# A source pin proves a remotely recoverable dev-publish tip, not that recent
# divergent work was considered. A release-ready app must carry an explicit
# direct-dev or feat1-prepublish selection receipt.
default_source_selection_state: pending
# Every governed build must use the exact current tip of this branch. A Store
# listing or a reachable historical commit is evidence, never source authority.
default_source_branch: dev-publish
# This is the business-release dependency closure, not a convenient
# group-name filter.  The scoped auditor refuses the entire MSB freeze if any
# item is absent from the governed catalog or fails the same current-source
# selection/receipt checks as the whole-store audit.  CyberTeller Config is
# deliberately named before its admission: its missing catalog row must fail
# by appId until its reviewed dev-publish source and selection receipt exist.
