schema: melusina-bazaar-catalog/v1
# This is the complete catalog ledger for the one default Bazaar:
# https://bazaar.melusina-os.org. It is derived from the live catalog snapshot,
# not from a local package scan or a smaller release subset. An entry may not be
# published until it is individually marked ready, and the whole catalog remains
# held until every live listing has a reconciled source and runtime contract.
#
# The snapshot is evidence, not a release approval. A new snapshot must update
# this manifest atomically; a changed count or an omitted immutable appId fails
# the release CLI closed.
catalog_origin: https://bazaar.melusina-os.org
catalog_observed_at: 2026-08-18T10:22:21Z
catalog_index_sha256: 807c6c82ebc0d8a8dc075b26a9669fb609909881b82bc01be6812324a2a990a5
expected_live_app_count: 33
default_release_state: hold
default_reconciliation_state: source-pinned
# Every governed build must use the exact current tip of this branch. A Store
# listing or a reachable historical commit is evidence, never source authority.
default_source_branch: dev-publish
#
# appId is authoritative; source paths and catalog names are deliberately
# descriptive because they historically differ.
#
# Every source_path below is relative to MEL_RELEASE_SOURCE_ROOT.  The release
# provider rejects an unset, non-canonical, symlinked, or escaping root/path.
# This prevents a release from silently following a vanished workstation
# worktree while keeping the manifest portable between clean release hosts.
# metadata_path and runtime_contract_path are optional, source-relative files
# for a unified application whose project Makefile lives above its product
# metadata. pack_target is an optional reviewed Make target for a separately
# signed variant emitted by the same source tree.
