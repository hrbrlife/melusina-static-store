        publish_slug: instaco
        catalog_name: InstaCo
        catalog_developer: hrbrlife
        # The app's GitHub repository uses the melusina- prefix, but its
        # already-active Store slot predates that rename.  This exact slot is
        # enforced by the sidecar; naming the GitHub repo would create a
        # duplicate instead of advancing the existing InstaCo release.
        catalog_repo: instaco-app
        catalog_slug: instaco
        role: series-llc-formation-and-corporate-registry
      instadao:
        appId: gcm92hhzx20xgtfakp0kpdywmav49m2p9wnq75rv35fez680j9k0
        source_path: instadao
        publish_slug: instadao
        catalog_name: InstaDAO
        # The historical Store package is a submodule with a legacy product
        # path.  It is the same immutable appId; bind this update there rather
        # than inventing a parallel package from the current repository name.
        catalog_developer: hrbrlife
        catalog_repo: MLSNA_token
        catalog_slug: mlsna-admin
        role: dao-formation-governance-and-treasury
