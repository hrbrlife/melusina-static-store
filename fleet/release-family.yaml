schema: melusina-release-family/v1
# Account-opening proof constellation. appId is authoritative; source paths and
# catalog names are deliberately descriptive because they historically differ.
#
# Every source_path below is relative to MEL_RELEASE_SOURCE_ROOT.  The release
# provider rejects an unset, non-canonical, symlinked, or escaping root/path.
# This prevents a release from silently following a vanished workstation
# worktree while keeping the manifest portable between clean release hosts.
families:
  money-path:
    apps:
      welcome:
        appId: 021x360jnqz798taefscu7r69a0xvvqyhfwfjadq8g2f9wuqm5h0
        source_path: /home/user/Desktop/worktrees/governed-dueprocess-0163/welcome-pearl
        publish_slug: welcome-pearl
        catalog_name: Welcome pearl
        role: public-account-opening-entry
      namedcoin:
        appId: 8kea8reanvm5cw7awrxj8udguh5hf3yfcns01fmq7vq42ps2hvuh
        source_path: namedcoin
        publish_slug: namedcoin
        catalog_name: NamedCoin
        catalog_developer: hrbrlife
        catalog_repo: melusina-namedcoin-app
        catalog_slug: namedcoin
        # The source Makefile deliberately refuses the disclosed devnet
        # keybox inputs in its default build.  This reviewed profile invokes
        # only its explicit `make pack-msb-test` target; no other app inherits
        # its build tags.
        pack_profile: namedcoin-msb-devnet
        role: identity-attestation-gate
