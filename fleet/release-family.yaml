        # This checkout is deliberately sibling to the canonical Fineract
        # sidecar, so Popaye's declared local Go-module dependency resolves
        # exactly as it does in the production source topology.
        source_path: worktrees/popaye-session-teardown-20260814
        publish_slug: popaye
        catalog_name: popaye
        catalog_developer: hrbrlife
        catalog_repo: ccash_go_htmx
        catalog_slug: popaye
