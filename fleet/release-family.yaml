        publish_slug: cyberteller
        catalog_name: cyberteller
        catalog_developer: hrbrlife
        catalog_repo: cyberteller
        catalog_slug: cyberteller
        role: crypto-deposit-and-swap
      cyberteller-config:
        appId: 3z8v9rsdkj4xn4exfvq9arqax90g6h9r1q2vp36d91ef7g07ce10
        source_path: cybertellerconfig
        publish_slug: cybertellerconfig
        catalog_name: Cyberteller Config
