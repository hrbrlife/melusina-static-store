<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 512 512"
     width="128" height="128">
  <rect x="0" y="0" width="512" height="512" fill="#C8D0D8" />
  <!-- Paint brush: ferrule, handle, bristles -->
  <g>
    <!-- Brush handle (diagonal) -->
    <rect x="300" y="96" width="56" height="176" rx="12"
          fill="#FFFFFF" stroke="#556170" stroke-width="14"
          transform="rotate(25 328 184)" />
    <!-- Ferrule -->
    <rect x="288" y="264" width="80" height="36" rx="6"
          fill="#556170"
          transform="rotate(25 328 282)" />
    <!-- Bristles -->
    <path d="M 256 296 L 400 356 L 368 416 L 224 356 Z"
          fill="#FFFFFF" stroke="#556170" stroke-width="14" stroke-linejoin="round" />
  </g>
  <!-- Paint drop -->
  <circle cx="144" cy="384" r="28" fill="#556170" />
</svg>
