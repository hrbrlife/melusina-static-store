<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 512 512"
     width="128" height="128">
  <rect x="0" y="0" width="512" height="512" fill="#BDEBCD" />
  <!-- 3x3 spreadsheet grid -->
  <g fill="none" stroke="#35A56A" stroke-width="14">
    <rect x="112" y="112" width="288" height="288" rx="12" />
    <line x1="112" y1="208" x2="400" y2="208" />
    <line x1="112" y1="304" x2="400" y2="304" />
    <line x1="208" y1="112" x2="208" y2="400" />
    <line x1="304" y1="112" x2="304" y2="400" />
  </g>
  <!-- Header row accent -->
  <rect x="112" y="112" width="288" height="56" fill="#35A56A" opacity="0.25" />
</svg>
