<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     viewBox="0 0 512 512"
     width="128" height="128">
  <rect x="0" y="0" width="512" height="512" fill="#BDEBCD" />
  <!-- Ledger lines in the background -->
  <g stroke="#35A56A" stroke-width="8" stroke-linecap="round" opacity="0.35">
    <line x1="96" y1="128" x2="416" y2="128" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="384" x2="416" y2="384" />
    <line x1="96" y1="432" x2="416" y2="432" />
  </g>
  <!-- Center gear -->
  <g transform="translate(256 256)">
    <g fill="#35A56A">
      <!-- 8 gear teeth -->
      <rect x="-22" y="-120" width="44" height="40" rx="4" />
      <rect x="-22" y="80"   width="44" height="40" rx="4" />
      <rect x="-120" y="-22" width="40" height="44" rx="4" />
      <rect x="80"  y="-22"  width="40" height="44" rx="4" />
      <rect x="-22" y="-120" width="44" height="40" rx="4" transform="rotate(45)" />
      <rect x="-22" y="80"   width="44" height="40" rx="4" transform="rotate(45)" />
      <rect x="-120" y="-22" width="40" height="44" rx="4" transform="rotate(45)" />
      <rect x="80"  y="-22"  width="40" height="44" rx="4" transform="rotate(45)" />
    </g>
    <circle cx="0" cy="0" r="80" fill="#35A56A" />
    <circle cx="0" cy="0" r="36" fill="#BDEBCD" />
  </g>
</svg>
