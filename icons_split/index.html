<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>App Icons - Teal Background</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; padding: 20px; }
  h1 { text-align: center; color: #A6E6F5; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1200px; margin: 20px auto; }
  .icon-card { background: #16213e; border-radius: 12px; padding: 15px; text-align: center; border: 1px solid #0f3460; }
  .icon-card img { width: 200px; height: 200px; border-radius: 8px; }
  .icon-card .label { margin-top: 10px; font-weight: bold; color: #A6E6F5; font-size: 16px; }
  .note { text-align: center; color: #999; max-width: 800px; margin: 10px auto; }
</style>
</head>
<body>
<h1>15 App Icons</h1>
<p class="note">All icons with #A6E6F5 teal background. SVG (128x128) + PNG (256x256).</p>
<div class="grid">
  <div class="icon-card"><img src="MerMail.png"><div class="label">MerMail</div></div>
  <div class="icon-card"><img src="AiLagoon.png"><div class="label">AiLagoon</div></div>
  <div class="icon-card"><img src="Bureau.png"><div class="label">Bureau</div></div>
  <div class="icon-card"><img src="DueProcess.png"><div class="label">DueProcess</div></div>
  <div class="icon-card"><img src="ClientSpace.png"><div class="label">ClientSpace</div></div>
  <div class="icon-card"><img src="MiniGit.png"><div class="label">MiniGit</div></div>
  <div class="icon-card"><img src="CrateLink.png"><div class="label">CrateLink</div></div>
  <div class="icon-card"><img src="NamedCoin.png"><div class="label">NamedCoin</div></div>
  <div class="icon-card"><img src="TeleScreen.png"><div class="label">TeleScreen</div></div>
  <div class="icon-card"><img src="BotMother.png"><div class="label">BotMother</div></div>
  <div class="icon-card"><img src="Vintage.png"><div class="label">Vintage</div></div>
  <div class="icon-card"><img src="CyberTeller.png"><div class="label">CyberTeller</div></div>
  <div class="icon-card"><img src="CashSurge.png"><div class="label">CashSurge</div></div>
  <div class="icon-card"><img src="Consilium.png"><div class="label">Consilium</div></div>
  <div class="icon-card"><img src="Teleport.png"><div class="label">Teleport</div></div>
</div>
</body>
</html>
