notification_cfg: '{"approve":true,"reject":true,"review":true}'

source: "Account Opening §2.1; AML/CFT Manual §5"
process_owner: "Compliance Officer"
card_naming_template: "{holder_name} — {account_type}"

kanban_columns:
  - id: intake
    name: INTAKE
    color: "#64748b"
    order: 0
  - id: review
    name: COMPLIANCE REVIEW
    color: "#eab308"
    order: 1
  - id: approval_c
    name: AWAITING COMPLIANCE APPROVAL
    color: "#3b82f6"
    order: 2
  - id: approval_e
    name: AWAITING EXECUTIVE SIGN-OFF
    color: "#6366f1"
    order: 3
  - id: completed
    name: COMPLETED
    color: "#22c55e"
    order: 4
  - id: rejected
    name: REJECTED
    color: "#ef4444"
    order: 5

roles:
  - id: client
    name: Client
    sandstorm_permission: respondent
  - id: compliance
    name: Compliance Officer
    sandstorm_permission: admin
  - id: executive
    name: Executive Director
    sandstorm_permission: admin

steps:
  - id: account_application
    column: intake
    type: form
    title: "Account Application"
    description: "Client submits account opening request."
    assigned_role: client
    access:
      client: edit
      compliance: view
      executive: view
    fields:
      - id: holder_name
        type: text
        label: "Account Holder Name"
        required: true
      - id: account_type
        type: select
        label: "Account Type"
        required: true
        options:
          - id: individual
            label: Individual
          - id: corporate
            label: Corporate
      - id: currency
        type: text
        label: "Currency"
        required: true
      - id: purpose
        type: textarea
        label: "Purpose of Account"
        required: true
    default_next_step: kyc_check

  - id: kyc_check
    column: review
    type: form
    title: "KYC/CDD Review"
    description: "Compliance officer performs KYC/CDD checks."
    assigned_role: compliance
    access:
      client: none
      compliance: edit
      executive: view
    fields:
      - id: kyc_passed
        type: checkbox
        label: "KYC verification passed"
        required: true
      - id: cdd_notes
        type: textarea
        label: "CDD Notes"
    default_next_step: compliance_approval

  - id: compliance_approval
    column: approval_c
    type: approval
    title: "Compliance Approval"
    description: "Compliance officer approves the account."
    assigned_role: compliance
    access:
      client: none
      compliance: edit
      executive: view
    approval:
      required_roles:
        - compliance
      min_approvers: 1
      review_data:
        - holder_name
        - account_type
        - currency
    conditions:
      - field: _approval_outcome
        operator: eq
        value: approved
        next_step: executive_signoff
      - field: _approval_outcome
        operator: eq
        value: rejected
        next_step: rejected_end
    default_next_step: executive_signoff

  - id: executive_signoff
    column: approval_e
    type: approval
    title: "Executive Sign-off"
    description: "Executive director provides final approval (four-eyes)."
    assigned_role: executive
    access:
      client: none
      compliance: view
      executive: edit
    approval:
      required_roles:
        - executive
      min_approvers: 1
      unique_reviewers: true
      review_data:
        - holder_name
        - account_type
        - currency
        - kyc_passed
    conditions:
      - field: _approval_outcome
        operator: eq
        value: approved
        next_step: account_opened
      - field: _approval_outcome
        operator: eq
        value: rejected
        next_step: rejected_end
    default_next_step: account_opened

  - id: rejected_end
    column: rejected
    type: complete
    title: "Application Rejected"
    description: "Account application was rejected."

  - id: account_opened
    column: completed
    type: complete
    title: "Account Opened"
    description: "Account has been successfully opened."
