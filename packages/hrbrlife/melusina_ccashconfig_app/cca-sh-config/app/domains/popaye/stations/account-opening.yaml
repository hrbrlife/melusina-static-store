      {"id":"executive","permissions":["view_pii","executive_signoff","reject_executive","activate_account"]},
      {"id":"client","permissions":["submit_application","view_own_case"]},
      {"id":"auditor","permissions":["view_pii","view_decisions","export_audit_log"]}
    ]
  }

