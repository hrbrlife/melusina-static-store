id: account-opening
name: "Account Opening"
process_type: account-opening
description: "New account application with KYC/CDD verification, compliance approval, executive sign-off (four-eyes), and automated account grain creation."
category: accounts
icon: "🏦"
version: 1

# subject_correlation declares that every case SHOULD be stamped with the
# ccash grain ID that owns the subject. Backed by Case.ClientGrainID in
# pkg/station/case_store.go (set opportunistically today by ClientHub
# orchestration; not yet engine-enforced — convention only for v0.1).
subject_correlation:
  required: true
  field: client_grain_id
  enforcement: convention
  description: "Sandstorm grain ID of the ccash client grain that owns this subject."

panels_json: |
  [
    {"id":"intake","label":"INTAKE","type":"active","color":"#64748b","order":0,"step_ids":["account_application"]},
    {"id":"review","label":"COMPLIANCE REVIEW","type":"active","color":"#eab308","order":1,"step_ids":["kyc_check"]},
    {"id":"approval_c","label":"AWAITING COMPLIANCE APPROVAL","type":"active","color":"#3b82f6","order":2,"step_ids":["compliance_approval"]},
    {"id":"approval_e","label":"AWAITING EXECUTIVE SIGN-OFF","type":"active","color":"#6366f1","order":3,"step_ids":["executive_signoff"]},
    {"id":"completed","label":"COMPLETED","type":"terminal","color":"#22c55e","order":4,"step_ids":["account_opened"]},
    {"id":"rejected","label":"REJECTED","type":"terminal","color":"#ef4444","order":5,"step_ids":["rejected_end"]}
  ]

hooks_json: |
  [
    {"id":"hook_application_received","name":"Application received → notify compliance","enabled":true,"trigger":{"event_type":"step_completed","step_id":"account_application"},"action":{"type":"email_send","target_label":"Compliance queue","to_field":"compliance_email","subject":"New account application — {{.holder_name}}","body_template":"A new {{.account_type}} account application has been submitted for {{.holder_name}}. Currency: {{.currency}}. Purpose: {{.purpose}}.","is_html":false}},
    {"id":"hook_compliance_approved","name":"Compliance approved → request executive sign-off","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"approved"},"action":{"type":"email_send","target_label":"Executive Director","to_field":"executive_email","subject":"Account opening awaits executive sign-off — {{.holder_name}}","body_template":"Compliance has approved the {{.account_type}} account for {{.holder_name}}. Please review and sign off in the procedures portal.","is_html":false}},
    {"id":"hook_executive_approved","name":"Executive sign-off → spawn account grain","enabled":true,"trigger":{"event_type":"step_completed","step_id":"executive_signoff","status_match":"approved"},"action":{"type":"process_start","target_label":"CCash Account","rule_id":"rule_account_open"}},
    {"id":"hook_account_grain_activate","name":"Account grain spawned → activate it via /api/v1/activate","enabled":true,"trigger":{"event_type":"step_completed","step_id":"account_opened"},"action":{"type":"grain_state_transition","target_label":"Activate spawned ccash grain","target_step":"executive_signoff","correlation_id_source":"case_id","bearer_token_env":"STATION_ACTIVATION_SECRET"}},
    {"id":"hook_account_opened_notify","name":"Account opened → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"account_opened"},"action":{"type":"email_send","target_label":"Client welcome","to_field":"holder_email","subject":"Your CCash account is open","body_template":"Welcome {{.holder_name}}, your {{.account_type}} account in {{.currency}} is now active. Sign in to your portal to view your balances and start moving funds.","is_html":false}},
    {"id":"hook_application_rejected","name":"Application rejected → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"rejected_end"},"action":{"type":"email_send","target_label":"Client rejection notice","to_field":"holder_email","subject":"Account application outcome","body_template":"Hello {{.holder_name}}, after review we are unable to proceed with your application at this time. Please contact compliance@ccash-demo.ch for further information.","is_html":false}},
    {"id":"hook_subprocedure_required_acct_open","name":"Enhanced/restricted tier → spawn screening child","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","filter_expr":"{\"in\":[{\"var\":\"approval_tier\"},[\"enhanced\",\"restricted\"]]}"},"action":{"type":"admin_route","admin_arm":"subprocedure.required","target_label":"Admin: spawn screening child","payload_keys":["case_id","process_type","seed_fields"]}}
  ]

grain_rules_json: |
  [
    {"id":"rule_account_open","name":"Open Account Grain","enabled":true,"mode":"autonomous","target_app_id":"ccash","target_action":0,"target_label":"CCash Account","append_timestamp":true,"share_role_id":1,"share_duration":-1,"share_single_use":false,"return_view_cap":true,"return_share_url":true,"required_permission":0},
    {"id":"rule_open_client_portal","name":"Open client portal grain","enabled":true,"mode":"autonomous","target_app_id":"ccash-portal","target_action":0,"target_label":"Client Portal","append_timestamp":false,"share_role_id":0,"share_duration":0,"share_single_use":true,"return_view_cap":true,"return_share_url":true,"required_permission":0}
  ]

registries_json: |
  {
    "entity": {
      "fields": [
        {"id":"holder_name","type":"text","label":"Account Holder Name","required":true,"max_length":200},
        {"id":"account_type","type":"select","label":"Account Type","required":true,"options":["individual","corporate"]},
        {"id":"currency","type":"text","label":"Account Currency","required":true,"max_length":3,"validation":"iso4217"},
        {"id":"purpose","type":"textarea","label":"Purpose of Account","required":true,"max_length":1000},
        {"id":"expected_monthly_volume_usd","type":"number","label":"Expected Monthly Volume (USD)","required":true},
        {"id":"jurisdiction","type":"text","label":"Country of Tax Residence","required":true,"max_length":2,"validation":"iso3166-1-alpha-2"},
        {"id":"pep","type":"boolean","label":"Politically Exposed Person?","required":true,"default":false},
        {"id":"sanctions_match","type":"boolean","label":"Sanctions match flag","required":false,"default":false},
        {"id":"holder_email","type":"email","label":"Holder Email","required":true},
        {"id":"compliance_email","type":"email","label":"Assigned Compliance Email","required":false,"default":"compliance@ccash-demo.ch"},
        {"id":"executive_email","type":"email","label":"Assigned Executive Email","required":false,"default":"executive@ccash-demo.ch"}
      ]
    },
    "case": {
      "fields": [
        {"id":"case_id","type":"text","label":"Case ID","system":true},
        {"id":"_approval_outcome","type":"text","label":"Approval outcome","system":true},
        {"id":"approval_tier","type":"text","label":"Risk tier","options":["standard","enhanced","restricted"]},
        {"id":"account_grain_id","type":"text","label":"Spawned account grain ID","system":true},
        {"id":"seed_fields","type":"text","label":"Seed fields JSON for child case","system":true}
      ]
    }
  }

ai_prompts_json: |
  {
    "cdd_summary": {
      "model": "claude-sonnet-4",
      "system": "You are a compliance assistant summarising CDD findings for a four-eyes reviewer. Be neutral, cite the supplied evidence only, never invent details. Maximum 150 words.",
      "user": "Holder: {{.holder_name}} ({{.account_type}}). Jurisdiction: {{.jurisdiction}}. Expected volume: USD {{.expected_monthly_volume_usd}}/month. PEP: {{.pep}}. Sanctions: {{.sanctions_match}}. CDD notes: {{.cdd_notes}}. Summarise the case for the executive."
    },
    "purpose_validation": {
      "model": "claude-sonnet-4",
      "system": "You assess whether a stated account purpose is plausible and consistent with the declared expected volume. Output strict JSON: {\"plausible\": bool, \"flags\": [string], \"recommendation\": \"approve|review|reject\"}.",
      "user": "Account type: {{.account_type}}. Purpose: \"{{.purpose}}\". Expected monthly volume USD: {{.expected_monthly_volume_usd}}. Jurisdiction: {{.jurisdiction}}."
    },
    "executive_brief": {
      "model": "claude-sonnet-4",
      "system": "You produce a one-paragraph executive brief for sign-off. Highlight risk tier, key findings, and the compliance recommendation. Do not paraphrase the applicant; rely strictly on the supplied data.",
      "user": "Tier: {{.approval_tier}}. Findings: {{.cdd_summary}}. Compliance recommendation: {{.compliance_decision}}."
    }
  }

permission_groups_json: |
  [
    {"id":"client","name":"Client","description":"The applicant or authorised signatory.","sandstorm_permission":"respondent","members_role":1},
    {"id":"compliance","name":"Compliance Officer","description":"Performs KYC/CDD review and first-tier approval.","sandstorm_permission":"admin","members_role":0},
    {"id":"executive","name":"Executive Director","description":"Final four-eyes sign-off.","sandstorm_permission":"admin","members_role":0},
    {"id":"auditor","name":"Auditor","description":"Read-only audit access.","sandstorm_permission":"viewer","members_role":2}
  ]

