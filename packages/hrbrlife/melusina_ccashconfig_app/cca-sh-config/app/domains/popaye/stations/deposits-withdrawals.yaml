notification_cfg: '{"approve":true,"reject":true,"review":true}'

source: "OTC Procedure §3; AML/CFT Manual §6.3"
process_owner: "Compliance Officer"
card_naming_template: "{direction} — {asset_type} {amount}"

kanban_columns:
  - id: intake
    name: INTAKE
    color: "#64748b"
    order: 0
  - id: review
    name: COMPLIANCE REVIEW
    color: "#eab308"
    order: 1
  - id: execution
    name: EXECUTION
    color: "#3b82f6"
    order: 2
  - id: completed
    name: COMPLETED
    color: "#22c55e"
    order: 3
  - id: rejected
    name: REJECTED
    color: "#ef4444"
    order: 4

roles:
  - id: client
    name: Client
    sandstorm_permission: respondent
  - id: accountant
    name: Accountant
    sandstorm_permission: admin
  - id: co
    name: Compliance Officer
    sandstorm_permission: admin

capabilities:
  - id: client_usd
    type: AccountAPI
    description: "Client settlement account (USD)"
    required: true
    spawn_on: never

steps:
  - id: "17.1"
    column: intake
    type: form
    title: "Transaction Request"
    description: "Client submits deposit or withdrawal request."
    assigned_role: client
    access:
      client: edit
      accountant: view
      co: view
    fields:
      - id: direction
        type: select
        label: "Direction"
        required: true
        options:
          - id: deposit
            label: Deposit
          - id: withdrawal
            label: Withdrawal
      - id: asset_type
        type: select
        label: "Asset Type"
        required: true
        options:
          - id: fiat
            label: Fiat
          - id: crypto
            label: Crypto
      - id: amount
        type: number
        label: "Amount"
        required: true
      - id: counterparty_id
        type: contact_picker
        label: "Counterparty"
        description: "Source for deposits, destination for withdrawals."
        required: true
        kind: contact
      - id: counterparty_label
        type: text
        label: "Counterparty (display label, set by picker)"
        system: true
      - id: provider_id
        type: provider_picker
        label: "Rail / Provider"
        description: "Settlement rail provider (SEPA bank, SWIFT correspondent, crypto custodian, etc.)."
        required: true
      - id: provider_label
        type: text
        label: "Provider (display label, set by picker)"
        system: true
    default_next_step: "17.2a"

  - id: "17.2a"
    column: review
    type: form
    title: "Source of Funds Verification"
    description: "Verify the declared source of funds. Risk band shown is system-populated by the screening callback fired at 17.1; the §4.5 spawn hook reads it on completion of this step."
    assigned_role: co
    access:
      client: none
      accountant: view
      co: edit
    fields:
      - id: risk_band
        type: text
        label: "Risk band (system-populated by screening callback)"
        system: true
      - id: screening_result
        type: text
        label: "Screening result (system-populated)"
        system: true
      - id: sof_verified
        type: checkbox
        label: "Source of funds verified"
        required: true
      - id: sof_notes
        type: textarea
        label: "Verification Notes"
    default_next_step: "17.3"

  - id: "17.3"
    column: execution
    type: form
    title: "Execute Transaction"
    description: "Process the deposit or withdrawal."
    assigned_role: accountant
    access:
      client: none
      accountant: edit
      co: view
    fields:
      - id: processed_amount
        type: number
        label: "Processed Amount"
        required: true
      - id: reference
        type: text
        label: "Transaction Reference"
        required: true
    default_next_step: "17.4"

  - id: "17.4"
    column: completed
    type: complete
    title: "Filed"
    description: "Transaction completed and filed."

  - id: rejected_end
    column: rejected
    type: complete
    title: "Transaction Rejected"
    description: "Transaction rejected. Reachable when admin pushes subprocedure.resolved with outcome=rejected from a screening child case (parent transitions here via the typed admin route), or when a high-value gate is denied at hook_high_value_block."
