metadata_json: |
  {
    "label": "Deposits & Withdrawals",
    "short_label": "Dep/Wd",
    "description": "Fiat and crypto deposit/withdrawal processing with sanctions screening, source-of-funds verification, and dual-entry ledger hooks.",
    "owner_role": "co",
    "compliance_basis": "FATF Recommendations 10, 16; FINMA Circular 2016/7; AMLA Art. 6 (ongoing monitoring); FINMA Travel-Rule guidance",
