    "groups": [
      {"id":"co","permissions":["view_pii","screen_counterparty","verify_sof","approve_high_value","reject_transaction","view_ledger"]},
      {"id":"accountant","permissions":["execute_transaction","post_ledger_entry","mark_settled","view_ledger"]},
      {"id":"client","permissions":["initiate_transaction","view_own_transactions"]},
      {"id":"auditor","permissions":["view_pii","view_ledger","export_audit_log"]}
    ]
  }

