id: deposits-withdrawals
name: "Deposits & Withdrawals"
process_type: deposits-withdrawals
description: "Fiat and crypto deposit/withdrawal processing with sanctions screening, source-of-funds verification, and dual-entry ledger hooks."
category: operations
icon: "💸"
version: 1

# subject_correlation declares that every case SHOULD be stamped with the
# ccash grain ID that owns the subject. Backed by Case.ClientGrainID in
# pkg/station/case_store.go (set opportunistically today by ClientHub
# orchestration; not yet engine-enforced — convention only for v0.1).
subject_correlation:
  required: true
  field: client_grain_id
  enforcement: convention
  description: "Sandstorm grain ID of the ccash client grain that owns this subject."

panels_json: |
  [
    {"id":"intake","label":"INTAKE","type":"active","color":"#64748b","order":0,"step_ids":["17.1"]},
    {"id":"review","label":"COMPLIANCE REVIEW","type":"active","color":"#eab308","order":1,"step_ids":["17.2a"]},
    {"id":"execution","label":"EXECUTION","type":"active","color":"#3b82f6","order":2,"step_ids":["17.3"]},
    {"id":"completed","label":"COMPLETED","type":"terminal","color":"#22c55e","order":3,"step_ids":["17.4"]},
    {"id":"rejected","label":"REJECTED","type":"terminal","color":"#ef4444","order":4,"step_ids":[]}
  ]

hooks_json: |
  [
    {"id":"hook_dep_intake","name":"Deposit/Withdrawal Received","enabled":true,"trigger":{"event_type":"webhook_received"},"action":{"type":"process_start","target_label":"Deposit / Withdrawal","rule_id":"rule_dep_wd"}},
    {"id":"hook_screening_request","name":"Screen counterparty before execution","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.1"},"action":{"type":"http_webhook","target_label":"TeleScreen Sanctions","url":"/hook/screening","method":"POST","body_template":"{\"counterparty\":\"{{.counterparty_label}}\",\"amount\":\"{{.amount}}\",\"asset\":\"{{.asset_type}}\",\"case_id\":\"{{.case_id}}\"}"}},
    {"id":"hook_credit_client","name":"Credit Client on Deposit","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.3","filter_expr":"{\"==\":[{\"var\":\"direction\"},\"deposit\"]}"},"action":{"type":"account_operation","target_label":"Credit client account","account_slot":"client_usd","account_op":"credit","amount_field":"processed_amount","ref_template":"DEP-{{.case_id}}","desc_template":"Deposit from {{.counterparty_label}}"},"gate":{"enabled":true,"value_field":"processed_amount","value_max":5000000,"default_action":"approval","approval_roles":["co"]}},
    {"id":"hook_debit_client","name":"Debit Client on Withdrawal","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.3","filter_expr":"{\"==\":[{\"var\":\"direction\"},\"withdrawal\"]}"},"action":{"type":"account_operation","target_label":"Debit client account","account_slot":"client_usd","account_op":"debit","amount_field":"processed_amount","ref_template":"WD-{{.case_id}}","desc_template":"Withdrawal to {{.counterparty_label}}"},"gate":{"enabled":true,"value_field":"processed_amount","value_max":5000000,"default_action":"approval","approval_roles":["co"]}},
    {"id":"hook_settlement_email","name":"Notify client on settlement","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.4"},"action":{"type":"email_send","target_label":"Client receipt","to_field":"client_email","subject":"Transaction {{.reference}} settled","body_template":"Your {{.direction}} of {{.processed_amount}} {{.asset_type}} (ref {{.reference}}) has been settled and posted to your account.","is_html":false}},
    {"id":"hook_high_value_block","name":"High-value transactions require four-eyes","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.2a","filter_expr":"{\">\":[{\"var\":\"amount_usd\"},50000]}"},"action":{"type":"process_start","target_label":"Four-Eyes Review","rule_id":"rule_dep_wd_four_eyes"},"gate":{"enabled":true,"risk_threshold":"high","value_field":"amount_usd","value_max":50000,"default_action":"approval","approval_roles":["co","accountant"]}},
    {"id":"hook_subprocedure_required_dep_wd","name":"Risk band ≥ medium → spawn screening child","enabled":true,"trigger":{"event_type":"step_completed","step_id":"17.2a","filter_expr":"{\"in\":[{\"var\":\"risk_band\"},[\"medium\",\"high\"]]}"},"action":{"type":"admin_route","admin_arm":"subprocedure.required","target_label":"Admin: spawn screening child","payload_keys":["case_id","process_type","seed_fields"]}}
  ]

grain_rules_json: |
  [
    {"id":"rule_dep_wd","name":"Deposit/Withdrawal","enabled":true,"mode":"autonomous","target_app_id":"dueprocess","target_action":0,"target_label":"Dep/Wd","append_timestamp":true,"share_role_id":1,"share_duration":-1,"share_single_use":false,"return_view_cap":true,"return_share_url":false,"required_permission":0},
    {"id":"rule_dep_wd_four_eyes","name":"Four-Eyes Review (high-value)","enabled":true,"mode":"interactive","target_app_id":"dueprocess","target_action":0,"target_label":"Four-Eyes Review","append_timestamp":true,"share_role_id":1,"share_duration":7,"share_single_use":false,"return_view_cap":true,"return_share_url":false,"required_permission":0}
  ]

registries_json: |
  {
    "transaction": {
      "fields": [
        {"id":"direction","type":"select","label":"Direction","required":true,"options":["deposit","withdrawal"]},
        {"id":"asset_type","type":"select","label":"Asset Type","required":true,"options":["fiat","crypto","stablecoin"]},
        {"id":"amount","type":"number","label":"Amount","required":true,"min":0},
        {"id":"currency","type":"text","label":"Currency","required":true,"max_length":4},
        {"id":"amount_usd","type":"number","label":"USD-equivalent amount","system":true},
        {"id":"counterparty_id","type":"text","label":"Counterparty contact ID (opaque)","required":true,"system":true},
        {"id":"counterparty_label","type":"text","label":"Counterparty display label","required":true,"max_length":200},
        {"id":"provider_id","type":"text","label":"Provider/rail ID (opaque)","required":true,"system":true},
        {"id":"provider_label","type":"text","label":"Provider/rail display label","required":true,"max_length":200},
        {"id":"method","type":"select","label":"Settlement Method","options":["sepa","swift","ach","card","crypto","wallet","mobile"]},
        {"id":"sof_verified","type":"boolean","label":"Source of funds verified","default":false},
        {"id":"sof_notes","type":"textarea","label":"Verification notes"},
        {"id":"processed_amount","type":"number","label":"Processed amount (smallest unit)"},
        {"id":"reference","type":"text","label":"External reference"},
        {"id":"client_email","type":"email","label":"Client email","required":false}
      ]
    },
    "case": {
      "fields": [
        {"id":"case_id","type":"text","label":"Case ID","system":true},
        {"id":"_approval_outcome","type":"text","label":"Approval outcome","system":true},
        {"id":"screening_result","type":"text","label":"Screening result","options":["clear","review","blocked"]},
        {"id":"risk_band","type":"text","label":"Risk band","options":["low","medium","high","blocked"]},
        {"id":"seed_fields","type":"text","label":"Seed fields JSON for child case","system":true}
      ]
    }
  }

ai_prompts_json: |
  {
    "sof_summary": {
      "model": "claude-sonnet-4",
      "system": "You summarise a source-of-funds declaration for a compliance reviewer. Highlight whether the declared origin is consistent with the amount and counterparty. Maximum 100 words. Cite only the supplied evidence.",
      "user": "Direction: {{.direction}}. Amount: {{.amount}} {{.currency}}. Counterparty: {{.counterparty_label}}. Declared SoF notes: {{.sof_notes}}. Summarise."
    },
    "screening_interpretation": {
      "model": "claude-sonnet-4",
      "system": "You interpret a sanctions/PEP screening result for an operations officer. Output JSON: {\"action\": \"proceed|review|block\", \"reason\": string, \"risk_band\": \"low|medium|high|blocked\"}.",
      "user": "Counterparty: {{.counterparty_label}}. Asset: {{.asset_type}}. Amount: {{.amount}} {{.currency}}. Result: {{.screening_result}}. Score: {{.screening_score}}/100. Hits: {{.screening_hits_json}}."
    },
    "settlement_narrative": {
      "model": "claude-sonnet-4",
      "system": "You produce a one-sentence ledger narrative suitable for the journal entry description field. No more than 80 characters. Plain factual tone.",
      "user": "Direction: {{.direction}}. Amount: {{.processed_amount}} {{.currency}}. Counterparty: {{.counterparty_label}}. Reference: {{.reference}}."
    }
  }

permission_groups_json: |
  [
    {"id":"client","name":"Client","description":"Account holder initiating the transaction.","sandstorm_permission":"respondent","members_role":1},
    {"id":"accountant","name":"Accountant","description":"Executes the transaction and posts ledger entries.","sandstorm_permission":"admin","members_role":0},
    {"id":"co","name":"Compliance Officer","description":"Verifies source of funds and screens counterparties.","sandstorm_permission":"admin","members_role":0},
    {"id":"auditor","name":"Auditor","description":"Read-only audit of all transactions.","sandstorm_permission":"viewer","members_role":2}
  ]

