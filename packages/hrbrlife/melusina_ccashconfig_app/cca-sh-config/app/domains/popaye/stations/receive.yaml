        {"id":"invoice_id","type":"text","label":"Cyberteller invoice ID","system":true},
        {"id":"deposit_address","type":"text","label":"Deposit address (chain-native)","system":true},
        {"id":"received_amount","type":"text","label":"Received amount (system-set)","system":true},
        {"id":"tx_hash","type":"text","label":"Settlement tx hash","system":true}
