    }
  }

ai_prompts_json: |
  {
    "receive_risk_summary": {
      "model": "claude-sonnet-4",
      "system": "You summarise the risk profile of an inbound payment for a compliance reviewer. Be concise (3 sentences max). Cite only supplied fields; never invent counterparties.",
      "user": "Senders: {{.senders_label_csv}}. Amount: {{.amount}} {{.currency}} ({{.currency_kind}}). Chain: {{.chain}}. Purpose: {{.purpose}}. Risk band: {{.risk_band}}. Screening: {{.screening_result}}. Summarise."
    }
  }

