  {
    "high_risk_countries": ["AF","BY","BI","CF","CD","CU","ER","IR","IQ","KP","LB","LY","ML","MM","NI","RU","SS","SD","SY","VE","YE","ZW"],
    "supported_currencies": ["USD","EUR","GBP","CHF","USDC","USDT","BTC","ETH","SOL"],
    "supported_chains": ["Solana","ethereum","tron","ton"],
    "purposes": ["goods","services","salary","family","investment","other"]
  }

metadata_json: |
  {
    "label": "Receive",
    "short_label": "Receive",
    "description": "Inbound payment to a client wallet with compliance review, approval gate, cyberteller invoice mint, and reconciliation on settlement.",
    "owner_role": "co",
    "compliance_basis": "FATF Recommendations 10, 16; Travel-Rule guidance; AMLA Art. 6 (ongoing monitoring)",
    "estimated_duration_minutes": 5,
    "tags": ["receive","payment","inbound","compliance","crypto"]
  }

notification_cfg: '{"approve":true,"reject":true,"review":true}'

source: "OTC Procedure §3; AML/CFT Manual §6.3"
process_owner: "Compliance Officer"
card_naming_template: "Receive ← {senders_label_csv} ({amount} {currency})"

kanban_columns:
  - id: intake
    name: INTAKE
    color: "#64748b"
    order: 0
  - id: review
    name: COMPLIANCE REVIEW
    color: "#eab308"
    order: 1
  - id: approval_c
    name: AWAITING COMPLIANCE APPROVAL
    color: "#3b82f6"
    order: 2
  - id: execution
    name: EXECUTION
    color: "#a855f7"
    order: 3
  - id: completed
    name: COMPLETED
    color: "#22c55e"
    order: 4
  - id: rejected
    name: REJECTED
    color: "#ef4444"
    order: 5

roles:
  - id: client
    name: Client
    sandstorm_permission: respondent
  - id: co
    name: Compliance Officer
    sandstorm_permission: admin
  - id: accountant
    name: Accountant
    sandstorm_permission: admin

steps:
  - id: senders
    column: intake
    type: form
    title: "Senders"
    description: "Pick one or more sender contacts."
    assigned_role: client
    access:
      client: edit
      co: view
      accountant: view
    fields:
      - id: sender_ids
        type: contact_picker
        label: "Senders"
        required: true
        kind: contact
        multi: true
      - id: senders_label_csv
        type: text
        label: "Senders (display labels, set by picker)"
        system: true
    default_next_step: amount

  - id: amount
    column: intake
    type: form
    title: "Amount"
    description: "Specify the amount and currency expected."
    assigned_role: client
    access:
      client: edit
      co: view
      accountant: view
    fields:
      - id: amount
        type: currency_amount
        label: "Amount"
        required: true
      - id: currency
        type: text
        label: "Currency"
        required: true
      - id: currency_kind
        type: select
        label: "Currency Kind"
        required: true
        options:
          - id: fiat
            label: Fiat
          - id: stablecoin
            label: Stablecoin
          - id: crypto
            label: Crypto
    default_next_step: destination

  - id: destination
    column: intake
    type: form
    title: "Destination"
    description: "Choose the wallet that will receive the funds."
    assigned_role: client
    access:
      client: edit
      co: view
      accountant: view
    fields:
      - id: destination_wallet_id
        type: wallet_picker
        label: "Destination Wallet"
        required: true
        filter_by_currency_kind: true
      - id: destination_wallet_label
        type: text
        label: "Destination Wallet (display label, set by picker)"
        system: true
    default_next_step: context

  - id: context
    column: intake
    type: form
    title: "Purpose & Context"
    description: "Provide the purpose and any supporting context for compliance review."
    assigned_role: client
    access:
      client: edit
      co: view
      accountant: view
    fields:
      - id: purpose
        type: select
        label: "Purpose of Payment"
        required: true
        options:
          - id: goods
            label: Goods
          - id: services
            label: Services
          - id: salary
            label: Salary
          - id: family
            label: Family Support
          - id: investment
            label: Investment
          - id: other
            label: Other
      - id: note
        type: textarea
        label: "Note"
      - id: projects
        type: text_multi
        label: "Projects"
      - id: attachments
        type: file_multi
        label: "Supporting Documents"
    default_next_step: confirm

  - id: confirm
    column: intake
    type: form
    title: "Review & Confirm"
    description: "Review the receive details and the risk band before submitting for approval."
    assigned_role: client
    access:
      client: edit
      co: view
      accountant: view
    fields:
      - id: risk_band
        type: risk_display
        label: "Risk band"
        system: true
    default_next_step: compliance_review

  - id: compliance_review
    column: review
    type: form
    title: "Compliance Review"
    description: "Compliance officer reviews the receive. Risk band shown is system-populated by the screening callback fired on confirm; the §4.5 spawn hook reads it on completion of this step to trigger a child screening case automatically."
    assigned_role: co
    access:
      client: none
      co: edit
      accountant: view
    fields:
      - id: risk_band
        type: text
        label: "Risk band (system-populated by screening callback)"
        system: true
      - id: screening_result
        type: text
        label: "Screening result (system-populated)"
        system: true
      - id: review_notes
        type: textarea
        label: "Review notes"
    default_next_step: compliance_approval

  - id: compliance_approval
    column: approval_c
    type: approval
    title: "Compliance Approval"
    description: "Compliance officer approves or rejects the receive. Approval mints the cyberteller invoice for crypto rails."
    assigned_role: co
    access:
      client: none
      co: edit
      accountant: view
    approval:
      required_roles:
        - co
      min_approvers: 1
      review_data:
        - senders_label_csv
        - amount
        - currency
        - chain
        - purpose
        - risk_band
    conditions:
      - field: _approval_outcome
        operator: eq
        value: approved
        next_step: mint_invoice
      - field: _approval_outcome
        operator: eq
        value: rejected
        next_step: rejected_end
    default_next_step: mint_invoice

  - id: mint_invoice
    column: execution
    type: machine
    title: "Mint Cyberteller Invoice"
    description: "Cyberteller mints a deposit invoice. Skipped automatically for fiat-only receives."
    service: cyberteller
    endpoint: /api/invoices
    fields:
      - id: invoice_id
        type: text
        label: "Cyberteller invoice ID"
        system: true
      - id: deposit_address
        type: text
        label: "Deposit address"
        system: true
    default_next_step: await_payment

  - id: await_payment
    column: execution
    type: machine
    title: "Await Payment"
    description: "Wait for cyberteller M2 webhook signalling the payment was received and confirmed."
    service: cyberteller
    endpoint: webhook
    fields:
      - id: received_amount
        type: text
        label: "Received amount"
        system: true
      - id: tx_hash
        type: text
        label: "Settlement tx hash"
        system: true
    default_next_step: settled

  - id: settled
    column: completed
    type: complete
    title: "Receive Settled"
    description: "Receive has been settled and reconciled to the ledger."

  - id: rejected_end
    column: rejected
    type: complete
    title: "Receive Rejected"
    description: "Receive was not authorised."
