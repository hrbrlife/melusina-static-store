    {"id":"accountant","name":"Accountant","description":"Reconciles the settled receive against the ledger.","sandstorm_permission":"admin","members_role":0},
    {"id":"auditor","name":"Auditor","description":"Read-only audit access.","sandstorm_permission":"viewer","members_role":2}
  ]

