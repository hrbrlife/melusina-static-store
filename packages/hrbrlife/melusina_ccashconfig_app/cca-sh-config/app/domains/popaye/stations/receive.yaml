id: receive
name: "Receive"
process_type: receive
description: "Inbound payment to a client wallet — sender pick (multi), amount + currency, destination wallet, purpose/notes, review with risk display, and on approval fire cyberteller invoice creation for crypto rails."
category: operations
icon: "📥"
version: 1

# subject_correlation declares that every case SHOULD be stamped with the
# ccash grain ID that owns the subject. Backed by Case.ClientGrainID in
# pkg/station/case_store.go (set opportunistically today by ClientHub
# orchestration; not yet engine-enforced — convention only for v0.1).
subject_correlation:
  required: true
  field: client_grain_id
  enforcement: convention
  description: "Sandstorm grain ID of the ccash client grain that owns this subject."

panels_json: |
  [
    {"id":"intake","label":"INTAKE","type":"active","color":"#64748b","order":0,"step_ids":["senders","amount","destination","context","confirm"]},
    {"id":"review","label":"COMPLIANCE REVIEW","type":"active","color":"#eab308","order":1,"step_ids":["compliance_review"]},
    {"id":"approval_c","label":"AWAITING COMPLIANCE APPROVAL","type":"active","color":"#3b82f6","order":2,"step_ids":["compliance_approval"]},
    {"id":"execution","label":"EXECUTION","type":"active","color":"#a855f7","order":3,"step_ids":["mint_invoice","await_payment"]},
    {"id":"completed","label":"COMPLETED","type":"terminal","color":"#22c55e","order":4,"step_ids":["settled"]},
    {"id":"rejected","label":"REJECTED","type":"terminal","color":"#ef4444","order":5,"step_ids":["rejected_end"]}
  ]

hooks_json: |
  [
    {"id":"hook_receive_intake","name":"Receive Initiated","enabled":true,"trigger":{"event_type":"webhook_received"},"action":{"type":"process_start","target_label":"Receive","rule_id":"rule_receive"}},
    {"id":"hook_receive_screen","name":"Screen senders before approval","enabled":true,"trigger":{"event_type":"step_completed","step_id":"confirm"},"action":{"type":"http_webhook","target_label":"TeleScreen Sanctions","url":"/hook/screening","method":"POST","body_template":"{\"counterparties\":\"{{.senders_label_csv}}\",\"amount\":\"{{.amount}}\",\"currency\":\"{{.currency}}\",\"case_id\":\"{{.case_id}}\"}"}},
    {"id":"hook_receive_approval_signed","name":"Approval signed → emit typed admin hook","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"approved"},"action":{"type":"admin_route","admin_arm":"approval.signed","target_label":"Admin: typed approval signal","payload_keys":["case_id","approver_role","tier","value_minor","currency"]}},
    {"id":"hook_subprocedure_required_receive","name":"High-risk receive → spawn screening child","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_review","filter_expr":"{\"in\":[{\"var\":\"risk_band\"},[\"medium\",\"high\"]]}"},"action":{"type":"admin_route","admin_arm":"subprocedure.required","target_label":"Admin: spawn screening child","payload_keys":["case_id","process_type","seed_fields"]}},
    {"id":"hook_cyber_create_invoice","name":"On approval → mint cyberteller invoice","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"approved","filter_expr":"{\"in\":[{\"var\":\"currency_kind\"},[\"crypto\",\"stablecoin\"]]}"},"action":{"type":"admin_route","admin_arm":"cyber.create_invoice","target_label":"Cyberteller: create invoice","payload_keys":["case_id","ccash_txn_id","chain","reference_currency","amount","accepted_currencies","webhook_url","idempotency_key","expires_at","post_receipt_kind","post_receipt_target","envelope"]}},
    {"id":"hook_receive_settle","name":"Receive settled → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"await_payment"},"action":{"type":"email_send","target_label":"Client receive receipt","to_field":"client_email","subject":"Receive {{.reference}} settled","body_template":"Your receive of {{.amount}} {{.currency}} from {{.senders_label_csv}} (ref {{.reference}}) has been settled.","is_html":false}},
    {"id":"hook_receive_rejected","name":"Receive rejected → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"rejected"},"action":{"type":"email_send","target_label":"Client receive rejection","to_field":"client_email","subject":"Receive not authorised","body_template":"Hello {{.client_name}}, the receive of {{.amount}} {{.currency}} from {{.senders_label_csv}} could not be authorised. Please contact compliance@ccash-demo.ch.","is_html":false}}
  ]

grain_rules_json: |
  [
    {"id":"rule_receive","name":"Receive Procedure","enabled":true,"mode":"autonomous","target_app_id":"dueprocess","target_action":0,"target_label":"Receive","append_timestamp":true,"share_role_id":1,"share_duration":-1,"share_single_use":false,"return_view_cap":true,"return_share_url":false,"required_permission":0}
  ]

