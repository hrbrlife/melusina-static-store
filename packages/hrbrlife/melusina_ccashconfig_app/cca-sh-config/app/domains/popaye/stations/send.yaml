id: send
name: "Send"
process_type: send
description: "Outbound payment from a client wallet — recipient pick, amount + currency selection, funding source + fee preview, purpose/notes, and review with risk display before settlement."
category: operations
icon: "📤"
version: 1

# subject_correlation declares that every case SHOULD be stamped with the
# ccash grain ID that owns the subject. Backed by Case.ClientGrainID in
# pkg/station/case_store.go (set opportunistically today by ClientHub
# orchestration; not yet engine-enforced — convention only for v0.1).
subject_correlation:
  required: true
  field: client_grain_id
  enforcement: convention
  description: "Sandstorm grain ID of the ccash client grain that owns this subject."

panels_json: |
  [
    {"id":"intake","label":"INTAKE","type":"active","color":"#64748b","order":0,"step_ids":["recipient","amount","funding","context","confirm"]},
    {"id":"review","label":"COMPLIANCE REVIEW","type":"active","color":"#eab308","order":1,"step_ids":["compliance_review"]},
    {"id":"approval_c","label":"AWAITING COMPLIANCE APPROVAL","type":"active","color":"#3b82f6","order":2,"step_ids":["compliance_approval"]},
    {"id":"execution","label":"EXECUTION","type":"active","color":"#a855f7","order":3,"step_ids":["execute"]},
    {"id":"completed","label":"COMPLETED","type":"terminal","color":"#22c55e","order":4,"step_ids":["settled"]},
    {"id":"rejected","label":"REJECTED","type":"terminal","color":"#ef4444","order":5,"step_ids":["rejected_end"]}
  ]

hooks_json: |
  [
    {"id":"hook_send_intake","name":"Send Initiated","enabled":true,"trigger":{"event_type":"webhook_received"},"action":{"type":"process_start","target_label":"Send","rule_id":"rule_send"}},
    {"id":"hook_send_screen","name":"Screen recipient before approval","enabled":true,"trigger":{"event_type":"step_completed","step_id":"confirm"},"action":{"type":"http_webhook","target_label":"TeleScreen Sanctions","url":"/hook/screening","method":"POST","body_template":"{\"counterparty\":\"{{.recipient_label}}\",\"amount\":\"{{.amount}}\",\"currency\":\"{{.currency}}\",\"case_id\":\"{{.case_id}}\"}"}},
    {"id":"hook_send_approval_signed","name":"Approval signed → emit typed admin hook","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"approved"},"action":{"type":"admin_route","admin_arm":"approval.signed","target_label":"Admin: typed approval signal","payload_keys":["case_id","approver_role","tier","value_minor","currency"]}},
    {"id":"hook_subprocedure_required_send","name":"High-risk send → spawn screening child","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_review","filter_expr":"{\"in\":[{\"var\":\"risk_band\"},[\"medium\",\"high\"]]}"},"action":{"type":"admin_route","admin_arm":"subprocedure.required","target_label":"Admin: spawn screening child","payload_keys":["case_id","process_type","seed_fields"]}},
    {"id":"hook_send_settle","name":"Send settled → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"execute"},"action":{"type":"email_send","target_label":"Client send receipt","to_field":"client_email","subject":"Send {{.reference}} settled","body_template":"Your send of {{.amount}} {{.currency}} to {{.recipient_label}} (ref {{.reference}}) has been settled.","is_html":false}},
    {"id":"hook_send_rejected","name":"Send rejected → notify client","enabled":true,"trigger":{"event_type":"step_completed","step_id":"compliance_approval","status_match":"rejected"},"action":{"type":"email_send","target_label":"Client send rejection","to_field":"client_email","subject":"Send not authorised","body_template":"Hello {{.client_name}}, your send of {{.amount}} {{.currency}} to {{.recipient_label}} could not be authorised. Please contact compliance@ccash-demo.ch.","is_html":false}}
  ]

grain_rules_json: |
  [
    {"id":"rule_send","name":"Send Procedure","enabled":true,"mode":"autonomous","target_app_id":"dueprocess","target_action":0,"target_label":"Send","append_timestamp":true,"share_role_id":1,"share_duration":-1,"share_single_use":false,"return_view_cap":true,"return_share_url":false,"required_permission":0}
  ]

registries_json: |
  {
    "transaction": {
      "fields": [
        {"id":"recipient_id","type":"text","label":"Recipient contact ID (opaque)","required":true,"system":true},
        {"id":"recipient_label","type":"text","label":"Recipient display label","required":true,"max_length":200},
        {"id":"amount","type":"text","label":"Amount (decimal string)","required":true},
        {"id":"currency","type":"text","label":"Currency","required":true,"max_length":4},
        {"id":"currency_kind","type":"select","label":"Currency Kind","required":true,"options":["fiat","stablecoin","crypto"]},
        {"id":"funding_wallet_id","type":"text","label":"Funding wallet ID (opaque)","required":true,"system":true},
        {"id":"funding_wallet_label","type":"text","label":"Funding wallet display label","required":true},
        {"id":"funding_method","type":"select","label":"Funding Method","required":true,"options":["sepa","swift","ach","card","crypto","wallet"]},
        {"id":"fee_minor","type":"text","label":"Estimated fee (minor units)","system":true},
        {"id":"fee_currency","type":"text","label":"Fee currency","system":true},
        {"id":"purpose","type":"select","label":"Purpose of Payment","required":true,"options":["goods","services","salary","family","investment","other"]},
        {"id":"note","type":"textarea","label":"Note","max_length":500},
        {"id":"projects","type":"text_multi","label":"Projects","required":false},
        {"id":"attachments","type":"file_multi","label":"Supporting Documents","accept":["application/pdf","image/jpeg","image/png"]},
        {"id":"reference","type":"text","label":"External reference","system":true},
        {"id":"client_name","type":"text","label":"Client name (for receipts)","system":true},
        {"id":"client_email","type":"email","label":"Client email (for receipts)","system":true}
      ]
    },
    "case": {
      "fields": [
        {"id":"case_id","type":"text","label":"Case ID","system":true},
        {"id":"_approval_outcome","type":"text","label":"Approval outcome","system":true},
        {"id":"approver_role","type":"text","label":"Approver role","system":true},
        {"id":"tier","type":"text","label":"Risk tier","options":["low","medium","high","blocked"],"system":true},
        {"id":"value_minor","type":"text","label":"Value in minor units (for typed hook)","system":true},
        {"id":"risk_band","type":"text","label":"Risk band","options":["low","medium","high","blocked"]},
        {"id":"screening_result","type":"text","label":"Screening result","options":["clear","review","blocked"]},
        {"id":"seed_fields","type":"text","label":"Seed fields JSON for child case","system":true}
      ]
    }
  }

ai_prompts_json: |
  {
    "send_risk_summary": {
      "model": "claude-sonnet-4",
      "system": "You summarise the risk profile of an outbound payment for a compliance reviewer. Be concise (3 sentences max). Cite only supplied fields; never invent counterparties or destinations.",
      "user": "Recipient: {{.recipient_label}}. Amount: {{.amount}} {{.currency}} ({{.currency_kind}}). Funding method: {{.funding_method}}. Purpose: {{.purpose}}. Risk band: {{.risk_band}}. Screening: {{.screening_result}}. Summarise."
    }
  }

