doc_matrix_json: |
  {
    "_description":"Document matrix indexed by (case_type, entity_type, risk_level). Document types come from the closed Bloom-depth vocabulary: proof_of_address, photo_id, power_of_attorney, power_of_attorney_corporate, beneficial_ownership_natural, beneficial_ownership_corporate, data_processing_consent, source_of_funds, source_of_funds_confirmation, entity_registration, founding_documents, governing_documents, trust_deed, stakeholder_verification, good_standing, business_license. Accept formats: pdf, jpg, jpeg, png. Status: uploaded | approved | removed.",
    "rules": [
      {"case_type":"natural_person","entity_type":"none","risk_level":"low",       "required":["photo_id","proof_of_address"],"optional":["data_processing_consent"]},
      {"case_type":"natural_person","entity_type":"none","risk_level":"medium",    "required":["photo_id","proof_of_address","source_of_funds"],"optional":["data_processing_consent","source_of_funds_confirmation"]},
      {"case_type":"natural_person","entity_type":"none","risk_level":"high",      "required":["photo_id","proof_of_address","source_of_funds","source_of_funds_confirmation"],"optional":["data_processing_consent"]},
      {"case_type":"natural_person","entity_type":"none","risk_level":"exclusion", "required":["photo_id","proof_of_address","source_of_funds","source_of_funds_confirmation","data_processing_consent"],"optional":[]},
      {"case_type":"entity","entity_type":"commercial","risk_level":"low",         "required":["entity_registration","founding_documents","beneficial_ownership_natural"],"optional":["good_standing","business_license"]},
      {"case_type":"entity","entity_type":"commercial","risk_level":"medium",      "required":["entity_registration","founding_documents","beneficial_ownership_natural","stakeholder_verification","source_of_funds"],"optional":["good_standing","business_license","power_of_attorney_corporate"]},
      {"case_type":"entity","entity_type":"commercial","risk_level":"high",        "required":["entity_registration","founding_documents","governing_documents","beneficial_ownership_natural","beneficial_ownership_corporate","stakeholder_verification","source_of_funds","source_of_funds_confirmation"],"optional":["power_of_attorney_corporate","good_standing"]},
      {"case_type":"entity","entity_type":"holding_private","risk_level":"medium", "required":["entity_registration","founding_documents","beneficial_ownership_natural","beneficial_ownership_corporate","stakeholder_verification"],"optional":["good_standing"]},
      {"case_type":"entity","entity_type":"holding_private","risk_level":"high",   "required":["entity_registration","founding_documents","governing_documents","beneficial_ownership_natural","beneficial_ownership_corporate","stakeholder_verification","source_of_funds","source_of_funds_confirmation"],"optional":["power_of_attorney_corporate"]},
      {"case_type":"entity","entity_type":"financial","risk_level":"medium",       "required":["entity_registration","business_license","beneficial_ownership_natural","stakeholder_verification"],"optional":["good_standing","governing_documents"]},
      {"case_type":"entity","entity_type":"financial","risk_level":"high",         "required":["entity_registration","business_license","governing_documents","beneficial_ownership_natural","beneficial_ownership_corporate","stakeholder_verification","source_of_funds","source_of_funds_confirmation"],"optional":["power_of_attorney_corporate"]},
      {"case_type":"entity","entity_type":"trust_foundation","risk_level":"medium","required":["entity_registration","trust_deed","beneficial_ownership_natural","stakeholder_verification"],"optional":["governing_documents"]},
      {"case_type":"entity","entity_type":"trust_foundation","risk_level":"high",  "required":["entity_registration","trust_deed","governing_documents","beneficial_ownership_natural","beneficial_ownership_corporate","stakeholder_verification","source_of_funds","source_of_funds_confirmation"],"optional":["power_of_attorney_corporate"]},
      {"case_type":"entity","entity_type":"partnership_business","risk_level":"medium","required":["entity_registration","founding_documents","beneficial_ownership_natural","stakeholder_verification"],"optional":["good_standing"]},
      {"case_type":"entity","entity_type":"non_profit","risk_level":"medium",      "required":["entity_registration","founding_documents","governing_documents","beneficial_ownership_natural"],"optional":["good_standing"]},
      {"case_type":"entity","entity_type":"statutory","risk_level":"medium",       "required":["entity_registration","founding_documents","governing_documents"],"optional":["good_standing"]}
    ],
    "accept_formats":["application/pdf","image/jpeg","image/jpg","image/png"],
    "status_values":["uploaded","approved","removed"]
  }

