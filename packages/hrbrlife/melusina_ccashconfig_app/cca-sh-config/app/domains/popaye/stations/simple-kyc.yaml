    color: "#eab308"
    order: 1
  - id: completed
    name: COMPLETED
    color: "#22c55e"
    order: 2
  - id: rejected
    name: REJECTED
    color: "#ef4444"
    order: 3

roles:
  - id: client
    name: Client
    sandstorm_permission: respondent
  - id: compliance
    name: Compliance Officer
    sandstorm_permission: admin

steps:
  - id: client_info
    column: intake
    type: form
    title: "Client Information"
    description: "Provide personal details for KYC review."
    assigned_role: client
    access:
      client: edit
      compliance: view
    fields:
      - id: full_name
        type: text
        label: "Full Legal Name"
        required: true
      - id: date_of_birth
        type: date
        label: "Date of Birth"
        required: true
      - id: nationality
        type: text
        label: "Nationality"
        required: true
      - id: email
        type: text
        label: "Email Address"
        required: true
      - id: phone
        type: text
        label: "Phone Number"
      - id: address
        type: textarea
        label: "Residential Address"
        required: true
    default_next_step: document_upload

  - id: document_upload
    column: intake
    type: form
    title: "Document Upload"
    description: "Upload identity document (passport, national ID, or driving licence). Plain file_upload for MVP; document_capture (Qwen3-VL OCR) ships v1.1."
    assigned_role: client
    access:
      client: edit
      compliance: view
    fields:
      - id: id_document
        type: file_upload
        label: "Identity Document"
        required: true
        accept:
          - image/jpeg
          - image/png
          - application/pdf
    default_next_step: officer_review

  - id: officer_review
    column: review
    type: approval
    title: "Compliance Review"
    description: "Compliance officer reviews submitted information and documents."
    assigned_role: compliance
    access:
      client: none
      compliance: edit
    approval:
      required_roles:
        - compliance
      min_approvers: 1
      review_data:
        - full_name
        - date_of_birth
        - nationality
      rejection_step: rejected_end
    conditions:
      - field: _approval_outcome
        operator: eq
        value: approved
        next_step: complete
      - field: _approval_outcome
        operator: eq
        value: rejected
        next_step: rejected_end
    default_next_step: complete

  - id: rejected_end
    column: rejected
    type: complete
    title: "KYC Rejected"
    description: "Application has been rejected."

  - id: complete
    column: completed
    type: complete
    title: "KYC Approved"
    description: "KYC review completed and approved."
