    "tags": ["kyc","onboarding","compliance"],
    "purposes": ["identity","aml_cft","source_of_wealth","beneficial_owner"]
  }

# V1.1 NamedCoin integration: closed list of KycPurpose snake_case wire
# strings this station may issue / check attestations for. Gates which
# Phase-2 flows the officer-review hook may fire.
namedcoin_attestation_purposes:
  - identity
  - aml_cft
  - source_of_wealth
  - beneficial_owner

# V1.1 NamedCoin officer-review pane. Read-only — populated by the
# kyc.check_response / kyc.attestation_issued / kyc.attestation_result
# hooks fired DOWNWARD from admin. SAR tipping-off (31 USC §5318(g)(2)):
# `namedcoin_revocation_reason` is the synthesised cover when
# `namedcoin_is_sar_redacted = true`; the actual cause is never persisted.
namedcoin_attestation_pane: |
  {
    "id": "namedcoin_attestation_pane",
    "visibility": "compliance",
    "kind": "namedcoin_attestation_pane",
    "fields": [
      {"id":"subject_wallet","label":"Subject wallet","kind":"text","readonly":true},
      {"id":"partner_license","label":"Issuer license","kind":"text","readonly":true},
      {"id":"namedcoin_status","label":"Attestation status","kind":"text","readonly":true},
      {"id":"namedcoin_attestation_pda","label":"Attestation PDA","kind":"text","readonly":true},
      {"id":"namedcoin_revocation_reason","label":"Revocation reason","kind":"text","readonly":true},
      {"id":"namedcoin_is_sar_redacted","label":"SAR-redacted","kind":"boolean","readonly":true}
    ]
  }

notification_cfg: '{"approve":true,"reject":true,"review":true}'

source: "AML/CFT Manual §3.1"
process_owner: "Compliance Officer"
card_naming_template: "{full_name} — KYC"

