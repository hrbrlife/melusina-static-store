metadata_json: |
  {
    "label": "Simple KYC",
    "short_label": "KYC",
    "description": "Streamlined 3-step KYC: client intake, document upload, compliance review.",
    "owner_role": "compliance",
    "compliance_basis": "FATF Recommendation 10; FINMA Circular 2016/7; AMLA Art. 3",
