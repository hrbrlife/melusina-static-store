<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="16" fill="url(#grad)"/>
  <g fill="white">
    <!-- Collection/portal icon: grid of cards -->
    <rect x="20" y="20" width="38" height="38" rx="6"/>
    <rect x="70" y="20" width="38" height="38" rx="6"/>
    <rect x="20" y="70" width="38" height="38" rx="6"/>
    <rect x="70" y="70" width="38" height="38" rx="6" fill="rgba(255,255,255,0.5)"/>
    <!-- Plus sign in bottom-right card -->
    <line x1="82" y1="89" x2="96" y2="89" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="89" y1="82" x2="89" y2="96" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
